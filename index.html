<script> <!-- Script pour le chargement différentiel des vidéos-->
document.addEventListener('DOMContentLoaded', function() {
  const itemsPerClick = 2;  // 2 rows = 6 vidéos
  const videoRows = Array.from(document.querySelectorAll('.video-row'));
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const spinner = loadMoreBtn.querySelector('.spinner-border');
  let shownCount = 2;  // Au départ, rang -2 et -1 sont visibles (2 rows)

  loadMoreBtn.addEventListener('click', function() {
    spinner.classList.remove('d-none');  // Animation loading Bootstrap
    loadMoreBtn.disabled = true;

    // Simule un petit délai pour l'effet loading
    setTimeout(() => {
      const nextRows = videoRows.slice(shownCount, shownCount + itemsPerClick);
      
      nextRows.forEach(row => {
        row.classList.remove('d-none');
      });

      shownCount += itemsPerClick;

      // Si plus de rows, cache le bouton
      if (shownCount >= videoRows.length) {
        loadMoreBtn.classList.add('d-none');
      }

      spinner.classList.add('d-none');
      loadMoreBtn.disabled = false;
    }, 500);  // Délai optionnel pour l'effet
  });
});
</script>
